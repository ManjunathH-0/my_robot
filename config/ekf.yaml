ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    transform_tolerance: 1.0
    transform_timeout: 0.2

    two_d_mode: true
    publish_tf: true

    map_frame: map
    frame_id: odom
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    publish_tf: true
    
    # We only care about the odom topic here
    odom0: /odom
    odom0_config: [true, true, false,
                    false, false, true,
                    true, true, false,
                    false, false, false,
                    false, false, false]