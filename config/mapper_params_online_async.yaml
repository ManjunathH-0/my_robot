slam_toolbox:
  ros__parameters:
    # Plugin settings
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver_type: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner_type: JACOBI
    ceres_trust_region_strategy_type: LEVENBERG_MARQUARDT
    
    # ROS Parameters
    use_sim_time: true
    odom_frame: odom
    base_frame: base_link
    # base_frame: chassis
    map_frame: map
    scan_topic: /scan
    lidar_frame: diff_drive_robot/base_link/lidar
   # scan_frame: diff_drive_robot/base_link/lidar
   # lidar_frame: diff_drive_robot/base_link/lidar
    
    
    # Mapping Parameters
    mode: mapping
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 20.0
    transform_timeout: 0.2  # Increase this if necessary
    tf_buffer_duration: 30.0
    minimum_travel_distance: 0.1  # If this is too high, it won't map!
    minimum_travel_heading: 0.2